# Supabase の Free プランは、1週間ほどDBへのアクセスがないとプロジェクトを
# 自動で一時停止する。審査中や配信直後に止まるとアプリが真っ白になるため、
# 毎日1回だけ軽いクエリを投げて「使われている」状態を保つ。
name: Supabase keepalive

on:
  schedule:
    # 毎日 23:17 UTC = 08:17 JST（毎時00分は混雑して遅延しやすいのでずらしてある）
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 絵とことば（art-thinking）に1回アクセスする
        env:
          URL: "https://wbhphtlxuetavuhekvxy.supabase.co"
          KEY: ${{ secrets.ETOKOTOBA_SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${KEY}" ]; then
            echo "::error::シークレット ETOKOTOBA_SUPABASE_ANON_KEY が未設定です。"
            echo "::error::Settings > Secrets and variables > Actions で追加してください。"
            exit 1
          fi
          code=$(curl -sS --max-time 30 -o response.txt -w '%{http_code}' \
            "${URL}/rest/v1/artworks?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" || echo "000")
          echo "HTTP ${code}"
          echo "--- response (先頭300文字) ---"
          head -c 300 response.txt || true
          echo ""
          # 200番台〜400番台はPostgresまで届いている＝アクティビティとして数えられる。
          # 000（応答なし）と500番台は、停止中か障害。
          case "${code}" in
            2*|4*)
              echo "プロジェクトは起きています。"
              ;;
            *)
              echo "::error::Supabaseが応答しません（HTTP ${code}）。プロジェクトが一時停止している可能性があります。"
              exit 1
              ;;
          esac

      - name: 月初だけ空コミットを打つ（スケジュール自動停止の予防）
        if: ${{ github.event_name == 'schedule' }}
        run: |
          # GitHubは「60日間リポジトリに動きがない」とcronを勝手に止める。
          # 毎月1日に空コミットを1つ置いて、その判定をリセットする。
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow enabled"
            git push
          else
            echo "月初ではないので何もしない。"
          fi
